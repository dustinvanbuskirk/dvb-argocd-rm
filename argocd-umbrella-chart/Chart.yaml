apiVersion: v2
name: dvb-argocd-umbrella
description: >-
  Umbrella chart wrapping the upstream argo-cd chart, so the chart version
  and default values are versioned in this repo instead of pointing the
  ApplicationSet directly at the upstream chart repository.
type: application
version: 0.1.0
appVersion: "9.5.15"

dependencies:
  - name: argo-cd
    version: "9.5.15"
    repository: https://argoproj.github.io/argo-helm
